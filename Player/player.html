<html>
    <head>
        <link rel="stylesheet" href="/style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        
        <title>Play | Among Us Live</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
        <style>
            form {
                flex-direction: column;
                justify-content:center;
                margin-inline:auto;
            }
            form button {
                margin-inline:auto;
            }
            #gameCode {
                padding:10px;
                border-radius:8px;
                border:none;
                font-size:16px;
                width:100%;
                max-width:200px;
                display:block;
                min-width:50px;
                height:50px;
                color:white;
                background-color: #111111;
                border:3px solid #ffffff;
                margin-inline:auto;
            }
            #gameCode:focus {
                outline:none;
            }
            #gameCode::placeholder {
                color:white;
            }
            #playerName {
                padding:10px;
                border-radius:8px;
                border:none;
                font-size:16px;
                width:100%;
                max-width:200px;
                display:block;
                min-width:50px;
                height:50px;
                color:white;
                background-color: #111111;
                border:3px solid #ffffff;
                margin-inline:auto;
            }
            #playerName:focus {
                outline:none;
            }
            #playerName::placeholder {
                color:white;
            }
        </style>
    </head>
    <body>
        <div id="header">
            <a class="material-button" href="/index.html"><span class="material-symbols-outlined">arrow_back</span></a>
        </div>
        <div id="main">
            <h2 id="heading">Join A Game</h2>
            <form id="joinForm">
                <input id="gameCode" type="text" placeholder="Enter Code" required><br>
                <input id="playerName" type="text" placeholder="Enter Name" required autocomplete="name"><br>
                <button type="submit"><span class="material-symbols-outlined">person_add</span></button>
            </form>
        </div>

        <!-- Active Gameplay View (Hidden initially) -->
        <div id="gameplayView" style="display: none;">
            <div id="info">
                <h1>Your role is: <span id="roleDisplay"></span></h1>
            </div>
            <div id="tasks">
                <h3>Your Tasks:</h3>
                <ul id="playerTaskList"></ul>
            </div>
        </div>
        <div id="footer">
            <p>© Copyright 2026 Emmett Wilson. Made with permission of the Loera Family. Not an official product of Innersloth LLC or its affiliates.</p>
        </div>
        <script src="/socket.io/socket.io.js"></script>
        <script src="player.js"></script>
    </body>
</html>
