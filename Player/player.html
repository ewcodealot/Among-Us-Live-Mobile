<html>
    <head>
        <link rel="stylesheet" href="/style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        
        <title>Play | Among Us Live</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
        <link rel="stylesheet" href="player.css">
    </head>
    <body>
        <div id="header">
            <a class="material-button" href="/index.html"><span class="material-symbols-outlined">arrow_back</span></a>
        </div>
        <div id="main">
            <h2 id="heading">Join A Game</h2>
            <form id="joinForm">
                <input id="gameCode" type="text" placeholder="Enter Code" required><br>
                <input id="playerName" type="text" placeholder="Enter Name" required autocomplete="name"><br>
                <button type="submit"><span class="material-symbols-outlined">person_add</span></button>
            </form>
        </div>

        <div id="gameplayView" style="display: none;">
            <div id="info">
                <h2>Your role is: <span id="roleDisplay"></span></h2>
            </div>
            <button class="collapsibleButton">Tasks</button>
            <div id="tasks" class="collapsible">
                <h3>Your Tasks:</h3>
                <ul id="playerTaskList">
                </ul>
            </div>
            <button class="collapsibleButton">Players</button>
            <div id="playersList" class="collapsible">
                <h3>Alive:</h3>
                <ul id="playerKnownListAlive">
                </ul>
                <h3>Dead:</h3>
                <ul id="playerKnownListDead">
                </ul>
            </div>
            <button class="collapsibleButton">Actions</button>
            <div id="actions" class="collapsible">
                <button id="emergencyMeeting" onClick="emergencyMeeting()">
                    <span class="material-symbols-outlined" style="font-size: 48px;">e911_emergency</span>
                    <span>Emergency Meeting</span>
                </button>
            </div>
            <button class="collapsibleButton">Progress</button>
            <div id="progress" class="collapsible">
                <h3>Total Tasks Done:</h3>
                <div id="totalTasksCont">
                    <span id="totalTasks"></span>
                </div>
            </div>
        </div>
        <div id="emergencyPopup" role="alertdialog" aria-modal="true" aria-hidden="true" style="display:none;">
            <h1>Emergency Meeting Called!</h1>
            <h2>Meet together and discuss</h2>
        </div>
        <div id="footer">
            <p>© Copyright 2026 Emmett Wilson. Made with permission of the Loera Family. Not an official product of Innersloth LLC or its affiliates.</p>
        </div>
        <script src="/socket.io/socket.io.js"></script>
        <script src="player.js"></script>
    </body>
</html>
