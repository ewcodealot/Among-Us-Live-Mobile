<html>
    <head>
        <link rel="stylesheet" href="/style.css">
        <title>Host | Among Us Live</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
        <link rel="stylesheet" href="host.css">
    </head>
    <body>
        <div id="header">
            <a class="material-button" href="/index.html"><span class="material-symbols-outlined">arrow_back</span></a>
        </div>
        <div id="main">
            <h2 id="heading">Host A Game</h2>
            <form id="hostForm" style="display:flex;">
                <input id="gameCode" type="text" placeholder="Make a Join Code" required>
                <label for="gameFile">Configuration JSON (optional)</label>
                <input type="file" id="gameFile" accept=".json,application/json">
                <button type="submit"><span class="material-symbols-outlined">group_add</span></button>
            </form>
            <div id="hostLobby" style="display: none; text-align: center; color: white;">
                <h2>Lobby Active!</h2>
                <h3>Room Code: <span id="displayCode"></span></h3>
                <h4>Connected Players:</h4>
                <ul id="playerList" style="list-style: none; padding: 0;"></ul>
                <button id="startGameBtn" onclick="triggerStartGame()" style="margin-top: 20px; padding: 10px 20px; font-size: 1.2rem;">Start Game</button>
            </div>
            <div id="activeGameView" style="display:none;">
                <h2 id="activeGameRoomCode">Room Code: ####</h2>
                <button class="collapsibleButton">Player List</button>
                <div class="collapsible">
                    <ul id="activeGamePlayers">

                    </ul>
                </div>
                <button class="collapsibleButton">Host Controls</button>
                <div class="collapsible" id="hostControls">
                    <button class="hostControl">Pause Game</button>
                    <button class="hostControl">Change Player Status</button>
                    <button class="hostControl">Sabotages</button>
                    <button class="hostControl">Remove Player</button>
                    <button class="hostControl">End Game</button>
                </div>
                <div id="hostGameActions" aria-label="Host game actions">
                    <button class="hostControl" id="hostEmergencyMeeting">Emergency Meeting</button>
                    <button class="hostControl" id="hostCompleteSabotage" disabled>Complete Sabotage</button>
                </div>
                <div id="gameUpdates" aria-label="Game updates">
                    <h3>Game Updates</h3>
                    <ul id="updateList" role="log" aria-live="polite" aria-relevant="additions">
                    </ul>
                </div>
            </div>
        </div>
        <div id="footer">
            <p></p>
        </div>
        <script src="/socket.io/socket.io.js"></script>
        <script src="host.js"></script>
    </body>
</html>
